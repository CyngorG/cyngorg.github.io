<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hooklift DEMO</title>
  <style>
    :root {
      --green: #185d36;
      --green-dark: #124a2a;
      --green-light: #5f9f7a;
      --green-mid: #2f6a4d;
      --green-strong: #1b3f2f;
      --bg: #e6e6e6;
      --white: #ffffff;
      --yellow-bg: #fff3cd;
      --yellow-border: #ffc107;
      --text: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .container {
      max-width: 660px;
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .header {
      background-color: var(--green);
      color: white;
      padding: 25px;
      text-align: center;
    }

    .header img {
      height: 75px;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .content {
      padding: 25px;
    }

    .news-box {
      background-color: var(--yellow-bg);
      border: 2px solid var(--yellow-border);
      color: var(--text);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      text-align: center;
    }

    .btn {
      position: relative;
      overflow: hidden;
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid black;
      cursor: pointer;
      color: white;
      transition: background-color 0.3s ease;
    }

    .main-btn {
      background-color: var(--green-mid);
    }

    .main-btn:hover {
      background-color: var(--green-strong);
    }

    .sub-btn {
      background-color: var(--green-light);
    }

    .sub-btn:hover {
      background-color: var(--green-mid);
    }

    .active {
      background-color: var(--green-strong) !important;
    }

    .sub-group {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      margin-top: -10px;
      margin-bottom: 18px;
    }

    .sub-group.show {
      max-height: 400px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <img src="https://www.gwynedd.llyw.cymru/SiteElements/Images/LogoCwcis.png" alt="Gwynedd Council Logo">
      <h1>Croeso Hooklift DEMO</h1>
    </div>

    <div class="content">

      <div class="news-box">
        ⚠️ MOT Due 17/10/2026
      </div>

      <a href="https://chekd.software/app/form/submit/skhwe691389ed3de71568919105" class="btn main-btn">
        Duty of Care HWRC
      </a>

      <a href="https://chekd.software/app/form/submit/erwam6ab51f678b6ef749911298" class="btn main-btn">
        HWRC Transfer Sites
      </a>

      <a href="https://chekd.software/app/inspect/qr/ifqbk690261c126fda387054901" class="btn main-btn">
        Daily Check
      </a>

      <button id="optionsBtn" class="btn main-btn" onclick="toggleOptions()">
        More Options
      </button>

      <div id="optionButtons" class="sub-group">
        <a href="https://chekd.software/app/form/submit/dewuh69cb9590e02df165315115" class="btn sub-btn">
          Request Holiday
        </a>
        <a href="https://chekd.software/app/form/submit/coeqg691389f770d03269006337" class="btn sub-btn">
          Report a Problem
        </a>
      </div>

    </div>

  </div>

  <script>
    function toggleOptions() {
      const section = document.getElementById("optionButtons");
      const btn = document.getElementById("optionsBtn");

      if (section.classList.contains("show")) {
        section.classList.remove("show");
        btn.classList.remove("active");
      } else {
        section.classList.add("show");
        btn.classList.add("active");
      }
    }
  </script>

</body>
</html>
